name: Deploy GitHub Pages

# Auto-Deploy ist DEAKTIVIERT, weil aktuell der GitHub-Default-Workflow
# "pages build and deployment" parallel deployt (Settings → Pages → Source:
# "Deploy from a branch"). Zwei parallele Deploys lösen Lock-Konflikte aus
# (HTTP 400, "Deployment request failed due to in progress deployment").
#
# Um diesen Workflow als alleinige Quelle zu nutzen:
#   1. Settings → Pages → Source auf "GitHub Actions" umstellen
#   2. Den push-Trigger unten wieder einkommentieren
#
# Bis dahin ist der File als Vorlage da; manuelles Triggern weiterhin möglich.

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
